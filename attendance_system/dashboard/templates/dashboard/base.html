{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AttendX Admin{% endblock %}</title>
  <style>
    :root {
      --teal: #00C896;
      --dark: #0A0A0F;
      --muted: #8A8A9A;
      --border: #e5e5ea;
      --bg: #f7f7f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--dark);
    }
    header {
      background: var(--dark); color: #fff; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .brand { font-weight: 700; letter-spacing: 0.5px; }
    header .brand span { color: var(--teal); }
    nav a {
      color: #cfcfd8; text-decoration: none; margin-left: 20px; font-size: 14px;
    }
    nav a:hover, nav a.active { color: var(--teal); }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    .stat-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
    .stat-box {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 20px; min-width: 170px; flex: 1;
    }
    .stat-box .num { font-size: 26px; font-weight: 700; }
    .stat-box .label { color: var(--muted); font-size: 13px; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .badge { padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.active { background: #e6f7f1; color: #1a7f37; }
    .badge.disabled { background: #f0f0f2; color: #999; }
    .badge.warn { background: #fff4e0; color: #b8860b; }
    .btn {
      display: inline-block; padding: 8px 16px; border-radius: 6px; border: none;
      background: var(--dark); color: #fff; font-weight: 600; font-size: 13px;
      cursor: pointer; text-decoration: none;
    }
    .btn.danger { background: #d64545; }
    .btn.teal { background: var(--teal); color: var(--dark); }
    .btn.outline { background: #fff; color: var(--dark); border: 1px solid var(--border); }
    input[type=text], input[type=password], select {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .messages { margin-bottom: 16px; }
    .messages .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
    .messages .error { background: #fdeaea; color: #a12626; }
    .messages .success { background: #e6f7f1; color: #1a7f37; }
    a.link { color: var(--teal); text-decoration: none; font-weight: 600; }
    .pagination { margin-top: 16px; font-size: 14px; }
    .pagination a { color: var(--teal); text-decoration: none; margin-right: 10px; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <div class="brand">Attend<span>X</span> Admin</div>
    <nav>
      <a href="{% url 'dashboard:home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Overview</a>
      <a href="{% url 'dashboard:device_list' %}" class="{% if 'device' in request.resolver_match.url_name %}active{% endif %}">Devices</a>
      <a href="{% url 'dashboard:event_log' %}" class="{% if request.resolver_match.url_name == 'event_log' %}active{% endif %}">Event Log</a>
      <a href="{% url 'dashboard:logout' %}">Log out ({{ user.username }})</a>
    </nav>
  </header>
  {% endif %}
  <main>
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
